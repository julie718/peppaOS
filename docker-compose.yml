# MayOS Docker Compose
#
# 启动:
#   docker compose up -d
#   → http://qweasd.top:3000  (HTTP 直连)
#   → https://qweasd.top      (HTTPS via Caddy)

services:
  mayos:
    build: .
    container_name: peppaos
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=2048
      LUMI_DATA_DIR: /app
      NODE_ENV: production
      OXOG_ENV_KEY: ${OXOG_ENV_KEY:-}
      # LLM
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # DeepSeek 外部强制路由（任务6）：环境变量覆盖 Web 桌面端配置
      DEEPSEEK_ROUTER_ENABLED: ${DEEPSEEK_ROUTER_ENABLED:-}
      DEEPSEEK_ROUTER_PRO_MODEL: ${DEEPSEEK_ROUTER_PRO_MODEL:-}
      DEEPSEEK_ROUTER_FLASH_MODEL: ${DEEPSEEK_ROUTER_FLASH_MODEL:-}
      DEEPSEEK_ROUTER_DAILY_PRO_TOKEN_BUDGET: ${DEEPSEEK_ROUTER_DAILY_PRO_TOKEN_BUDGET:-}
      DEEPSEEK_ROUTER_BUDGET_WARN_RATIO: ${DEEPSEEK_ROUTER_BUDGET_WARN_RATIO:-}
      DEEPSEEK_ROUTER_IDLE_INNERTICK_INTERVAL_MS: ${DEEPSEEK_ROUTER_IDLE_INNERTICK_INTERVAL_MS:-}
      # Phase2：PEPPA_INNER_TICK_ENABLE 仅管控 chat_turn 对话回合触发源（默认 true）；scheduler/dream/narrative 等其他 runInnerTick 调用点不受管控
      PEPPA_INNER_TICK_ENABLE: ${PEPPA_INNER_TICK_ENABLE:-true}
      # Phase3：自主技能拓展系统总开关与熔断（false = 一键关闭整套 Phase3；默认 true）
      PEPPA_PHASE3_SKILL_AUTO_ENABLE: ${PEPPA_PHASE3_SKILL_AUTO_ENABLE:-true}
      PEPPA_PHASE3_MAX_TOOLS_PER_SESSION: ${PEPPA_PHASE3_MAX_TOOLS_PER_SESSION:-10}
      PEPPA_PHASE3_BREAKER_WINDOW_MINUTES: ${PEPPA_PHASE3_BREAKER_WINDOW_MINUTES:-60}
      PEPPA_PHASE3_GLOBAL_MAX_TOOLS: ${PEPPA_PHASE3_GLOBAL_MAX_TOOLS:-30}
      PEPPA_PHASE3_RISK_POLICY: ${PEPPA_PHASE3_RISK_POLICY:-strict}
      PEPPA_PHASE3_STRUCTURED_LOG: ${PEPPA_PHASE3_STRUCTURED_LOG:-true}
      # 供应链防护：第三方 npm MCP 包无签名/完整性校验，默认禁止加载（false 时安装请求抛风险报错；true=显式信任放行）
      ALLOW_UNSIGNED_MCP_NPM_PACKAGES: ${ALLOW_UNSIGNED_MCP_NPM_PACKAGES:-false}
      # STT
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      # TTS
      DOUBAO_SPEECH_KEY: ${DOUBAO_SPEECH_KEY:-}
      # Auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PEPPA_PASSWORD: ${PEPPA_PASSWORD:-peppa_2026}
      CORS_ORIGINS: http://localhost:3000,https://qweasd.top:4043,http://qweasd.top:3000,capacitor://localhost,https://peppa.qweasd.top,https://qweasd.top
    volumes:
      - ./data:/app/data
      - ./server:/app/server
      # src/ 源码挂载（tsx 源码模式运行必需）：src/utils/paradigmGuard、src/core/innerTick 等被 server/ 静态引用
      - ./src:/app/src
      - ./server.ts:/app/server.ts
      - ./db_layer.ts:/app/db_layer.ts
      - ./logger.ts:/app/logger.ts
      - ./launcher.ts:/app/launcher.ts
      - ./routes:/app/routes
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
    entrypoint: ""
    command: npx tsx /app/server.ts
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "4043:4043"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_certs:/caddy_certs
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
