# MayOS Docker Compose
#
# 启动:
#   docker compose up -d
#   → http://qweasd.top:3000  (HTTP 直连)
#
# ═══════════════════════════════════════════════════════════════════
# P2-6 NAS 部署运维（生产目标：群晖 NAS /vol1/1000/docker/peppaos）
# ───────────────────────────────────────────────────────────────────
# 0) 前置：NAS 上新建 /vol1/1000/docker/peppaos，把仓库内容同步过去
#    （rsync -av --delete ./ user@nas:/vol1/1000/docker/peppaos/，排除 node_modules/dist/data），
#    并放置 .env（JWT_SECRET、OXOG_ENV_KEY、各 LLM key、CLOUDFLARE_TUNNEL_TOKEN）。
#
# 1) 部署/升级：
#    cd /vol1/1000/docker/peppaos
#    GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
#    验证：docker compose ps 显示 peppaos healthy，curl -s http://localhost:3000/api/health
#
# 2) 回滚：git 回到上一 commit 后重新 build；数据（peppa.db、keys.json、用户文件）
#    全部在 ./data 卷，代码回滚不影响数据。
#
# 3) 日志（P2-3 分层 + json-file 轮转）：
#    docker compose logs -f mayos                # 控制台（pino 主通道）
#    docker exec peppaos tail -f logs/mind.log   # 心智（InnerTick 推演回合）
#    docker exec peppaos tail -f logs/perception.log  # 感知（视觉/音频/空间）
#    docker exec peppaos tail -f logs/action.log # 动作（工具执行）
#
# 4) SQLite 数据与归档（P0-1 增量持久化 + P2-4 自动归档）：
#    ./data/peppa.db —— 唯一数据源；容器重启后 flushDB 只写变化表，秒级启动
#    ./data/db_archive/peppa-YYYYMMDD.db —— 超 100MB 每天自动 VACUUM INTO 归档
#    手动备份：cp data/peppa.db data/peppa-$(date +%Y%m%d).bak（应用运行中建议先
#    sqlite3 快照，或直接用归档文件）。
#
# 5) 停止/维护（P2-2 stop_grace_period=30s：SIGTERM → flushDB + 归档收尾再退出，
#    足够完成收尾，超时才会 SIGKILL）：
#    docker compose stop     # 优雅停止（等服务收尾，最多 30s）
#    docker compose down     # 停止并移除容器（保留卷与镜像）
#    docker compose restart  # 热重启
#
# 6) 健康检查（P0-1 后启动窗口秒级，start_period 已从 1200s 恢复 30s）：
#    caddy 等待 peppaos healthy 后才挂载 upstream，避免旧版 15 分钟启动窗口期间
#    的 502 连锁；若容器反复 unhealthy，先看启动日志而不是等 start_period。
# ═══════════════════════════════════════════════════════════════════

services:
  mayos:
    build:
      context: .
      args:
        # 版本标识注入（镜像内 LUMI_BUILD_ID → /api/health buildId）
        # 部署: GIT_COMMIT=$(git rev-parse --short HEAD) docker compose up -d --build
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: peppaos
    # Zombie 修复：node 直接作 PID1 不回收孤儿进程 → 容器内僵尸 PID 堆积，
    # docker compose down 报 "PID xxx is zombie and can not be killed" 无法停止。
    # init: true 内嵌 tini 作 PID1（信号转发 + 子进程回收），不升级镜像、不动业务配置。
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      # 内存治理：宿主仅 8G（swap 4G 常满），容器稳态 RSS ~2.6G 已逼近全局 OOM 阈值；
      # V8 heap 2G→1.5G 强制更积极 GC，把容器 RSS 基线压到 ~2G，为宿主留余量
      NODE_OPTIONS: --max-old-space-size=1536
      LUMI_DATA_DIR: /app
      NODE_ENV: production
      OXOG_ENV_KEY: ${OXOG_ENV_KEY:-}
      # LLM
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # DeepSeek 外部强制路由（任务6）：环境变量覆盖 Web 桌面端配置
      DEEPSEEK_ROUTER_ENABLED: ${DEEPSEEK_ROUTER_ENABLED:-}
      DEEPSEEK_ROUTER_PRO_MODEL: ${DEEPSEEK_ROUTER_PRO_MODEL:-}
      DEEPSEEK_ROUTER_FLASH_MODEL: ${DEEPSEEK_ROUTER_FLASH_MODEL:-}
      DEEPSEEK_ROUTER_DAILY_PRO_TOKEN_BUDGET: ${DEEPSEEK_ROUTER_DAILY_PRO_TOKEN_BUDGET:-}
      DEEPSEEK_ROUTER_BUDGET_WARN_RATIO: ${DEEPSEEK_ROUTER_BUDGET_WARN_RATIO:-}
      DEEPSEEK_ROUTER_IDLE_INNERTICK_INTERVAL_MS: ${DEEPSEEK_ROUTER_IDLE_INNERTICK_INTERVAL_MS:-}
      # Phase2：PEPPA_INNER_TICK_ENABLE 仅管控 chat_turn 对话回合触发源（默认 true）；scheduler/dream/narrative 等其他 runInnerTick 调用点不受管控
      PEPPA_INNER_TICK_ENABLE: ${PEPPA_INNER_TICK_ENABLE:-true}
      # Phase3：自主技能拓展系统总开关与熔断（false = 一键关闭整套 Phase3；默认 false — Phase-2 收紧，
      # 灰度开启需显式改为 true）
      PEPPA_PHASE3_SKILL_AUTO_ENABLE: ${PEPPA_PHASE3_SKILL_AUTO_ENABLE:-false}
      PEPPA_PHASE3_MAX_TOOLS_PER_SESSION: ${PEPPA_PHASE3_MAX_TOOLS_PER_SESSION:-10}
      PEPPA_PHASE3_BREAKER_WINDOW_MINUTES: ${PEPPA_PHASE3_BREAKER_WINDOW_MINUTES:-60}
      PEPPA_PHASE3_GLOBAL_MAX_TOOLS: ${PEPPA_PHASE3_GLOBAL_MAX_TOOLS:-30}
      PEPPA_PHASE3_RISK_POLICY: ${PEPPA_PHASE3_RISK_POLICY:-strict}
      PEPPA_PHASE3_STRUCTURED_LOG: ${PEPPA_PHASE3_STRUCTURED_LOG:-true}
      # Phase-2 综合修复：节律调度（活跃/半休眠/深度休眠）
      PEPPA_RHYTHM_ACTIVE_MIN: ${PEPPA_RHYTHM_ACTIVE_MIN:-30}
      PEPPA_RHYTHM_HALF_SLEEP_HOURS: ${PEPPA_RHYTHM_HALF_SLEEP_HOURS:-2}
      PEPPA_RHYTHM_DEEP_SLEEP_HOURS: ${PEPPA_RHYTHM_DEEP_SLEEP_HOURS:-6}
      PEPPA_RHYTHM_ACTIVE_TICK_MIN: ${PEPPA_RHYTHM_ACTIVE_TICK_MIN:-10}
      PEPPA_RHYTHM_HALF_TICK_MIN: ${PEPPA_RHYTHM_HALF_TICK_MIN:-60}
      PEPPA_RHYTHM_DEEP_TICK_MIN: ${PEPPA_RHYTHM_DEEP_TICK_MIN:-120}
      PEPPA_RHYTHM_DRY_RUN: ${PEPPA_RHYTHM_DRY_RUN:-false}
      PEPPA_INNER_TICK_SLIM: ${PEPPA_INNER_TICK_SLIM:-true}
      # Phase-2：后台 LLM 任务并发门闸 / 资源防护
      PEPPA_BG_MAX_CONCURRENT: ${PEPPA_BG_MAX_CONCURRENT:-2}
      PEPPA_BG_QUEUE_MAX: ${PEPPA_BG_QUEUE_MAX:-8}
      PEPPA_BG_WAIT_MAX_MS: ${PEPPA_BG_WAIT_MAX_MS:-120000}
      PEPPA_BG_MEM_MAX_MB: ${PEPPA_BG_MEM_MAX_MB:-2048}
      PEPPA_BG_LLM_RETRY: ${PEPPA_BG_LLM_RETRY:-0}
      PEPPA_SCHEDULER_STAGGER_MAX_MS: ${PEPPA_SCHEDULER_STAGGER_MAX_MS:-60000}
      # Phase-2：每日后台 token 预算（0 = 不限制）
      PEPPA_DAILY_TOKEN_BUDGET: ${PEPPA_DAILY_TOKEN_BUDGET:-8000000}
      PEPPA_TOKEN_BUDGET_LOG_INTERVAL_MIN: ${PEPPA_TOKEN_BUDGET_LOG_INTERVAL_MIN:-60}
      # Phase-2：memory_tree prompt 硬上限
      PEPPA_MEMORY_TREE_MAX_ORPHANS: ${PEPPA_MEMORY_TREE_MAX_ORPHANS:-80}
      PEPPA_MEMORY_TREE_MAX_TREE_NODES: ${PEPPA_MEMORY_TREE_MAX_TREE_NODES:-60}
      PEPPA_MEMORY_TREE_MAX_PROMPT_TOKENS: ${PEPPA_MEMORY_TREE_MAX_PROMPT_TOKENS:-4000}
      # Phase-2：reminder 防洪（重启/停机后不批量补发）
      PEPPA_REMINDER_MAX_PER_ROUND: ${PEPPA_REMINDER_MAX_PER_ROUND:-5}
      PEPPA_REMINDER_MAX_STALE_HOURS: ${PEPPA_REMINDER_MAX_STALE_HOURS:-24}
      # 供应链防护：第三方 npm MCP 包无签名/完整性校验，默认禁止加载（false 时安装请求抛风险报错；true=显式信任放行）
      ALLOW_UNSIGNED_MCP_NPM_PACKAGES: ${ALLOW_UNSIGNED_MCP_NPM_PACKAGES:-false}
      # STT
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      # TTS
      DOUBAO_SPEECH_KEY: ${DOUBAO_SPEECH_KEY:-}
      # Auth（必需：无兜底值，缺失时 compose 直接报错，避免可猜测密钥上线）
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in the host .env}
      PEPPA_PASSWORD: ${PEPPA_PASSWORD:-peppa_2026}
      CORS_ORIGINS: http://localhost:3000,http://qweasd.top:3000,capacitor://localhost,https://peppa.qweasd.top,https://qweasd.top,https://peppaos.qweasd.top
      # 屏蔽neteasemusic报错技能
      PEPPA_DISABLE_SKILLS: neteasemusic
    volumes:
      # 生产部署（NAS）：不再挂载任何 ts 源码——代码全部来自 Dockerfile 构建产物，
      # 避免宿主机 zip 更新与容器卷挂载产生版本不一致 → SQLITE_MISUSE 句柄崩溃。
      # 唯一保留的卷：数据持久化。
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped
    # P2-2 优雅停止：SIGTERM 后给足 30s 让服务完成 flushDB 收尾/归档检查再退出，
    # 超时才 SIGKILL（默认 10s 在启动期 100MB 全量持久化时代不足以安全落盘）。
    stop_grace_period: 30s
    # 502 根因已由 P0-1 修复：增量表级持久化 + flushDB 脏写门控 → 容器重启
    # 启动窗口从 15+ 分钟降为秒级，start_period 恢复 30s（原 1200s 是旧全量
    # 重建时代的宽限期，不再需要；保留过大的 start_period 会掩盖真实启动故障）。
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:'+(process.env.PORT||3000)+'/health',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - peppaos_default

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "4043:4043"
    environment:
      - CADDY_AUTO_HTTPS=off
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - peppaos_default
    depends_on:
      mayos:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # 正式命名隧道：token 从 .env 注入，禁止明文写死在 compose 文件
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - peppaos_default

networks:
  peppaos_default:

volumes:
  caddy_data:
  caddy_config:
