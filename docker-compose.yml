# MayOS Docker Compose
#
# 启动:
#   docker compose up -d
#   → http://qweasd.top:3000  (HTTP 直连)

services:
  mayos:
    build: .
    container_name: peppaos
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=2048
      LUMI_DATA_DIR: /app
      NODE_ENV: production
      OXOG_ENV_KEY: ${OXOG_ENV_KEY:-}
      # LLM
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # DeepSeek 外部强制路由（任务6）：环境变量覆盖 Web 桌面端配置
      DEEPSEEK_ROUTER_ENABLED: ${DEEPSEEK_ROUTER_ENABLED:-}
      DEEPSEEK_ROUTER_PRO_MODEL: ${DEEPSEEK_ROUTER_PRO_MODEL:-}
      DEEPSEEK_ROUTER_FLASH_MODEL: ${DEEPSEEK_ROUTER_FLASH_MODEL:-}
      DEEPSEEK_ROUTER_DAILY_PRO_TOKEN_BUDGET: ${DEEPSEEK_ROUTER_DAILY_PRO_TOKEN_BUDGET:-}
      DEEPSEEK_ROUTER_BUDGET_WARN_RATIO: ${DEEPSEEK_ROUTER_BUDGET_WARN_RATIO:-}
      DEEPSEEK_ROUTER_IDLE_INNERTICK_INTERVAL_MS: ${DEEPSEEK_ROUTER_IDLE_INNERTICK_INTERVAL_MS:-}
      # Phase2：PEPPA_INNER_TICK_ENABLE 仅管控 chat_turn 对话回合触发源（默认 true）；scheduler/dream/narrative 等其他 runInnerTick 调用点不受管控
      PEPPA_INNER_TICK_ENABLE: ${PEPPA_INNER_TICK_ENABLE:-true}
      # Phase3：自主技能拓展系统总开关与熔断（false = 一键关闭整套 Phase3；默认 true）
      PEPPA_PHASE3_SKILL_AUTO_ENABLE: ${PEPPA_PHASE3_SKILL_AUTO_ENABLE:-true}
      PEPPA_PHASE3_MAX_TOOLS_PER_SESSION: ${PEPPA_PHASE3_MAX_TOOLS_PER_SESSION:-10}
      PEPPA_PHASE3_BREAKER_WINDOW_MINUTES: ${PEPPA_PHASE3_BREAKER_WINDOW_MINUTES:-60}
      PEPPA_PHASE3_GLOBAL_MAX_TOOLS: ${PEPPA_PHASE3_GLOBAL_MAX_TOOLS:-30}
      PEPPA_PHASE3_RISK_POLICY: ${PEPPA_PHASE3_RISK_POLICY:-strict}
      PEPPA_PHASE3_STRUCTURED_LOG: ${PEPPA_PHASE3_STRUCTURED_LOG:-true}
      # 供应链防护：第三方 npm MCP 包无签名/完整性校验，默认禁止加载（false 时安装请求抛风险报错；true=显式信任放行）
      ALLOW_UNSIGNED_MCP_NPM_PACKAGES: ${ALLOW_UNSIGNED_MCP_NPM_PACKAGES:-false}
      # STT
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      # TTS
      DOUBAO_SPEECH_KEY: ${DOUBAO_SPEECH_KEY:-}
      # Auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PEPPA_PASSWORD: ${PEPPA_PASSWORD:-peppa_2026}
      CORS_ORIGINS: http://localhost:3000,http://qweasd.top:3000,capacitor://localhost,https://peppa.qweasd.top,https://qweasd.top,https://peppaos.qweasd.top
      # 屏蔽neteasemusic报错技能
      PEPPA_DISABLE_SKILLS: neteasemusic
    volumes:
      # 生产部署（NAS）：不再挂载任何 ts 源码——代码全部来自 Dockerfile 构建产物，
      # 避免宿主机 zip 更新与容器卷挂载产生版本不一致 → SQLITE_MISUSE 句柄崩溃。
      # 唯一保留的卷：数据持久化。
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped
    # 502 根因修复：peppa.db 100MB 全量重建 + 磁盘 45MB/s → 启动需 15+ 分钟。
    # 原 30s start_period 导致容器过早被标记 unhealthy；改为 20 分钟启动宽限期，
    # 期间检查失败不计入 retries。
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:'+(process.env.PORT||3000)+'/health',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200?0:1))}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - peppaos_default

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "4043:4043"
    environment:
      - CADDY_AUTO_HTTPS=off
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - peppaos_default
    depends_on:
      mayos:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # 正式命名隧道：token 从 .env 注入，禁止明文写死在 compose 文件
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - peppaos_default

networks:
  peppaos_default:

volumes:
  caddy_data:
  caddy_config: