# MayOS Docker Compose
#
# 启动:
#   docker compose up -d
#   → http://qweasd.top:3000  (HTTP 直连)
#   → https://qweasd.top      (HTTPS via Caddy)

services:
  mayos:
    build: .
    container_name: peppaos
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_OPTIONS: --max-old-space-size=2048
      LUMI_DATA_DIR: /app
      NODE_ENV: production
      OXOG_ENV_KEY: ${OXOG_ENV_KEY:-}
      # LLM
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      # STT
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      # TTS
      DOUBAO_SPEECH_KEY: ${DOUBAO_SPEECH_KEY:-}
      # Auth
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PEPPA_PASSWORD: ${PEPPA_PASSWORD:-peppa_2026}
      CORS_ORIGINS: http://localhost:3000,https://qweasd.top:4043,http://qweasd.top:3000,capacitor://localhost,https://peppa.qweasd.top,https://qweasd.top
    volumes:
      - ./data:/app/data
      - ./server:/app/server
      - ./server.ts:/app/server.ts
      - ./db_layer.ts:/app/db_layer.ts
      - ./logger.ts:/app/logger.ts
      - ./launcher.ts:/app/launcher.ts
      - ./routes:/app/routes
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
    entrypoint: ""
    command: npx tsx /app/server.ts
    deploy:
      resources:
        limits:
          memory: 4g
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "4043:4043"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_certs:/caddy_certs
      - caddy_data:/data
    restart: unless-stopped

volumes:
  caddy_data:
